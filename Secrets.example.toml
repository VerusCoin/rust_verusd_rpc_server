# Fill out this file, rename it to Secrets.toml, then run

rpc_user = "RPC_USER"
rpc_password = "RPC_PASSWORD"

tls_cert_path = "/path/to/fullchain.pem"
tls_key_path  = "/path/to/privkey.pem"

# Lookup blocklists. Addresses must be canonical 34-character i-addresses or
# R-addresses. Transaction IDs must be 64 hexadecimal characters. Requests are
# rejected without revealing which entry matched. Identity names are resolved
# only when resolve_identity_names_for_blocklist is enabled in Conf.toml; an
# empty address blocklist never triggers identity-name resolution.
address_blocklist = []
txid_blocklist = []

# API key authentication. Set auth_enabled in Conf.toml explicitly. When it is
# true, this table is required, must be non-empty, and every request must be
# authenticated. When auth_enabled is false, this table is ignored.
# Each entry maps an app ID to its shared secret. When this section is present
# and non-empty, every request must include X-App-ID, X-Timestamp (ms since
# epoch), X-Auth-Token, X-VRPC-API-Version: 2, and X-Salt (64 hex chars,
# 32 random bytes) headers. The token is BLAKE2b-512 over:
#   time_string | api_key | request_body | app_id | version | salt
# Replay is rejected only when both time and salt match a previous request.
# [api_keys]
# my-app = "replace-with-a-long-random-secret"
